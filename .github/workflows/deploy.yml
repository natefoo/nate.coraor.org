name: Deploy

on:
  push:
    branches:
      - main

env:
  NOKOGIRI_USE_SYSTEM_LIBRARIES: "true"
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.7"
          bundler-cache: true
      - run: bundle exec jekyll build
      - run: |
         mkdir -p "$HOME/.ssh"
         echo 'enospc.org ssh-rsa ' >> "$HOME/.ssh/known_hosts"
         echo 'enospc.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBD5M8NAJost/yNDQdDp5wYw5GoRQq7dRYxpgT3HRYu3VnhbA8s2P3Vc1p2iFtGE66QAWtDEQJnBPdw2jbWTK/o0=' >> "$HOME/.ssh/known_hosts"
         echo 'enospc.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDlDRkaAxhyXM4WuCZLjhEaN6GjOwKXo4YKCG6N21ibD' >> "$HOME/.ssh/known_hosts"
         ssh-agent -a $SSH_AUTH_SOCK > /dev/null
         ssh-add - <<< "${{ secrets.DEPLOY_KEY }}"
      - run: rsync -av --delete _site/ sites@enospc.org:/data/sites/nate.coraor.org

